name: Check independent Core desktop platforms
on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-desktop-checks
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify desktop release signatures independently of Umbrel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/upstream_release.py --platform-checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-verified-context
          path: releases/upstream/verification.json
  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: windows-2025, target: windows-x64}
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-verified-context
          path: .verified
      - name: Verify signed archive and run native version checks
        run: python scripts/check_upstream_platform.py ${{ matrix.target }} --evidence .verified/verification.json --output .release/platforms/${{ matrix.target }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-platform-${{ matrix.target }}
          if-no-files-found: error
          include-hidden-files: true
          path: .release/platforms/*.json
