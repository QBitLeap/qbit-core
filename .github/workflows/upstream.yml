name: Publish verified upstream Core update
on:
  schedule:
    - cron: '19 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-upstream-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      image_changed: ${{ steps.upstream.outputs.image_changed }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify official stable release and pinned three-signer quorum
        id: upstream
        run: python scripts/upstream_release.py
      - name: Test source and retained UI contracts
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python -m unittest discover -s tests -v
          node checks/dashboard.test.cjs
          python checks/render_preview.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.upstream.outputs.changed == 'true'
        with:
          name: core-verified-context
          if-no-files-found: error
          path: |
            runtime.lock.json
            Dockerfile
            scripts/prepare_core_context.py
            releases/upstream/verification.json
            README.md
  desktop:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: windows-2025, target: windows-x64}
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-verified-context
          path: .verified
      - name: Verify signed archive and run native version checks
        run: python scripts/check_upstream_platform.py ${{ matrix.target }} --evidence .verified/releases/upstream/verification.json --output .release/platforms/${{ matrix.target }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: core-platform-${{ matrix.target }}
          if-no-files-found: error
          include-hidden-files: true
          path: .release/platforms/*.json
  publish:
    needs: [prepare, desktop]
    if: needs.prepare.outputs.changed == 'true' && needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: core-verified-context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: core-platform-*
          merge-multiple: true
          path: .release/platforms
      - name: Verify complete platform evidence and commit source inputs locally
        run: |
          python scripts/platform_receipt.py check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git add -- runtime.lock.json Dockerfile scripts/prepare_core_context.py releases/upstream/verification.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Pin upstream release verified on every supported desktop platform'
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: needs.prepare.outputs.image_changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and publish immutable Umbrel candidate images
        if: needs.prepare.outputs.image_changed == 'true'
        env:
          CORE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release_images.py "${CORE_VERSION}-upstream.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --publish
      - name: Publish complete four-platform receipt for catalog acceptance
        env:
          CORE_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_CHANGED: ${{ needs.prepare.outputs.image_changed }}
        run: |
          python scripts/platform_receipt.py publish
          git add -- releases/upstream/latest.json
          git commit -m 'Publish verified Core platform and image receipt'
          git push origin HEAD:main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: core-upstream-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            releases/upstream
            .release/platforms
            .release/*/published-images.json
