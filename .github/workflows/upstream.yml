name: Publish verified upstream Core update
on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-upstream-publication
  cancel-in-progress: false
jobs:
  upstream:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Verify stable upstream release and pinned signing quorum
        id: upstream
        run: python scripts/upstream_release.py
      - name: Test source and retained UI contracts
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python -m unittest discover -s tests -v
          node checks/dashboard.test.cjs
          python checks/render_preview.py
      - name: Commit verified source inputs locally
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config commit.gpgsign false
          git add -- runtime.lock.json Dockerfile scripts/prepare_core_context.py releases/upstream/verification.json README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Pin verified upstream Core release'
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: steps.upstream.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, smoke-test and publish immutable candidate images
        if: steps.upstream.outputs.changed == 'true'
        env:
          CORE_VERSION: ${{ steps.upstream.outputs.version }}
        run: python scripts/release_images.py "${CORE_VERSION}-upstream.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --publish
      - name: Publish image/source receipt for the catalog acceptance pipeline
        if: steps.upstream.outputs.changed == 'true'
        env:
          CORE_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          python -c "import json,os,subprocess;from pathlib import Path;v=os.environ['CORE_VERSION'];build=v+'-upstream.'+os.environ['GITHUB_RUN_ID']+'.'+os.environ['GITHUB_RUN_ATTEMPT'];r=json.loads(Path('.release',build,'published-images.json').read_text());r.update(upstreamTag='v'+v,upstreamVerification=json.loads(Path('releases/upstream/verification.json').read_text()),sourceRevision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),catalogAcceptanceRequired=True);Path('releases/upstream/latest.json').write_text(json.dumps(r,indent=2)+'\n')"
          git add -- releases/upstream/latest.json
          git commit -m 'Publish verified upstream Core image receipt'
          git push origin HEAD:main
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: core-upstream-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            releases/upstream
            .release/*/published-images.json
            .release/*/core/release-context.json
